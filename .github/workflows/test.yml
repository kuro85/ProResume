name: Test

on:
  push:
    paths:
      - 'resume-tenure.code.tex'
      - 'tests/tenure-test.tex'
  pull_request:
    paths:
      - 'resume-tenure.code.tex'
      - 'tests/tenure-test.tex'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tenure tests
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: tests
          root_file: tenure-test.tex
          latexmk_use_xelatex: true
